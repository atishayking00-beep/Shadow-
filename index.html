<style>
:root{--c:#19c8ff;--bg:#000207;--tx:#9fd4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-m=devil]{--c:#ff3b4e}body[data-m=love]{--c:#ff5fae}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,#05142a,var(--bg) 72%);color:var(--tx);font:13px monospace;display:flex;flex-direction:column;gap:8px;padding:8px;transition:.6s;user-select:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000058 3px 4px)}
#top{display:flex;justify-content:space-around;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);padding:6px;background:#04101c99;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%,0 8px)}
.rg{text-align:center;font-size:9px;letter-spacing:1px}
.rg div{width:38px;height:38px;border-radius:50%;margin:0 auto 2px;background:conic-gradient(var(--c) calc(var(--v,0)*1%),#ffffff1c 0);display:grid;place-items:center;font-size:10px;position:relative}
.rg div:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#031427}
.rg div span{position:relative;z-index:1}
#hud{width:min(78vw,300px);margin:0 auto;filter:drop-shadow(0 0 6px var(--c));transition:transform .15s,filter .3s}
svg{width:100%;display:block}
.r{transform-box:fill-box;transform-origin:center;animation:sp calc(var(--d)*1s/var(--k,1)) linear infinite;fill:none;stroke:var(--c)}
#hud.lis{--k:2;animation:br 3s ease-in-out infinite}#hud.spk{--k:6;animation:br .45s ease-in-out infinite}#hud.thk{--k:11}#hud.usr{--k:8;transform:scale(1.07);filter:drop-shadow(0 0 22px var(--c))}#hud.pl{transform:scale(1.07);filter:drop-shadow(0 0 28px var(--c))}
@keyframes br{50%{transform:scale(1.035)}}
@keyframes sp{to{transform:rotate(1turn)}}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p{position:relative;padding:5px 8px 5px 34px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:#04101c99;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));min-height:34px}
.p i{position:absolute;left:0;top:0;bottom:0;width:28px;display:grid;place-items:center;font:700 14px monospace;font-style:normal;background:#07243c99;color:var(--c)}
.p b{display:block;font-size:9px;opacity:.65;letter-spacing:1px}
.p em{font:700 13px monospace;font-style:normal;white-space:nowrap}
.bar{height:2px;background:#ffffff1c;margin-top:3px}.bar div{height:100%;background:var(--c);width:0;transition:1s}
#bars{display:flex;gap:3px;align-items:flex-end;height:38px;border-bottom:1px solid var(--c);padding:0 6px}
#bars div{flex:1;background:var(--c);opacity:.8;transition:.6s;min-height:2px}
#log{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font:12px system-ui,sans-serif}
.b{padding:6px 9px;border-radius:8px;border:1px solid #ffffff22;max-width:90%}
.u{align-self:flex-end;background:#ffffff12}.a{align-self:flex-start;background:#000a;border-color:var(--c)}
.b span{white-space:pre-wrap}.b pre{overflow-x:auto;margin:4px 0;color:var(--c);font-size:11px}
.b a{display:inline-block;margin:5px 5px 0 0;padding:4px 9px;border:1px solid var(--c);border-radius:16px;color:var(--c);text-decoration:none}
#hint{text-align:center;color:var(--c);animation:bl 1.2s infinite;letter-spacing:2px}
@keyframes bl{50%{opacity:.2}}
</style></head><body data-m="normal">

function sense(){const c=navigator.connection;if(c){D.net=c.effectiveType||'--';D.dl=c.downlink||0;D.rtt=c.rtt||0}
hist.push(Math.min(1,(D.dl||.5)/10));if(hist.length>16)hist.shift();
navigator.storage&&navigator.storage.estimate&&navigator.storage.estimate().then(e=>{D.use=e.usage;D.q=e.quota});paint()}
try{navigator.getBattery().then(b=>{const u=()=>{D.bat=Math.round(b.level*100);D.chg=b.charging;paint()};u();b.onlevelchange=b.onchargingchange=u})}catch(e){}
sense();setInterval(sense,2000);
const phone=()=>'Phone status: battery '+(D.bat==null?'unknown':D.bat+'%'+(D.chg?' charging':''))+', network '+D.net+' '+D.dl+'Mbps rtt '+D.rtt+'ms, RAM~'+D.mem+'GB, cores '+D.cpu+', time '+new Date().toLocaleTimeString()+'.';
/* ---- chat ---- */
const TAG=/\[\[(call|open|search):([^\]]+)\]\]/g;
function fill(d,x){d.textContent='';x.split('```').forEach((p,i)=>{if(i%2){const e=document.createElement('pre');e.textContent=p.replace(/^\w*\n/,'');d.appendChild(e)}else{const t=p.replace(TAG,'').trim();if(t){const s=document.createElement('span');s.textContent=t;d.appendChild(s)}}});
for(const a of x.matchAll(TAG)){const l=document.createElement('a'),v=a[2].trim();l.textContent={call:'📞 Call ',open:'🌐 Open ',search:'🔎 Search '}[a[1]]+v;l.target='_blank';l.rel='noopener';l.href=a[1]=='call'?'tel:'+v.replace(/[^\d+]/g,''):a[1]=='open'?(/^https?:\/\//.test(v)?v:'https://'+v):'https://www.google.com/search?q='+encodeURIComponent(v);d.appendChild(l)}}
function bubble(m){const d=document.createElement('div');d.className='b '+m.r;fill(d,m.x);$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function store(r,x){S.h[S.mode].push({r,x,t:Date.now()});save()}
function add(r,x,s){store(r,x);bubble({r,x});if(s)say(x)}
function say(x){const t=x.replace(/```[\s\S]*?```/g,' code screen par hai ').replace(TAG,'').replace(/[*_#]/g,'');if(!t.trim()||!window.speechSynthesis)return;
speechSynthesis.cancel();const m=S.mode!='love',u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices().filter(v=>/^hi|en-IN/i.test(v.lang)).sort((a,b)=>/^en/i.test(b.lang)-/^en/i.test(a.lang));
u.voice=vs.find(v=>m?(/male|ravi|hemant|rishi/i.test(v.name)&&!/female/i.test(v.name)):/female|kalpana|swara|heera/i.test(v.name))||vs[0]||null;
u.lang=u.voice?u.voice.lang:'hi-IN';u.pitch=m?.5:1.4;u.rate=m?.95:1;sp=1;state('SPEAKING');try{rec&&rec.stop()}catch(e){}
u.onboundary=()=>{const h=$('#hud');h.classList.add('pl');setTimeout(()=>h.classList.remove('pl'),140)};u.onend=u.onerror=()=>{sp=0;state('STANDBY');listen()};speechSynthesis.speak(u)}
function listen(){if(!on||sp||busy||deny)return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('#hint').textContent='Voice ke liye Chrome use karo';return}
if(!rec){rec=new R();rec.lang='hi-IN';rec.onstart=()=>{started=1;$('#hint').style.display='none';state('LISTENING')};
rec.onspeechstart=()=>$('#hud').classList.add('usr');rec.onspeechend=()=>$('#hud').classList.remove('usr');rec.onresult=e=>heard(e.results[0][0].transcript);rec.onend=()=>{if(!sp&&!busy){state('STANDBY');setTimeout(listen,300)}};
rec.onerror=e=>{if(e.error=='not-allowed'||e.error=='service-not-allowed'){started=0;deny=1;const h=$('#hint');h.style.display='';h.style.animation='none';h.textContent='MIC BLOCKED ('+e.error+') — is page ko Chrome me seedha (https) kholo, ya Chrome Settings > Site > Microphone > Allow'}}}
try{rec.start()}catch(e){}}
function detect(t){t=t.toLowerCase();if(/devil|jag jao|utho shadow|khel khelne|खेल|जाग जाओ|उठो/.test(t))return'devil';if(/shreya|love mo+de?|yaad aa rahi|श्रेया|याद आ रही/.test(t))return'love';if(/normal mo+de?|mood normal|नॉर्मल/.test(t))return'normal'}
function heard(t){const m=detect(t),w=/shadow|शैडो|शेडो|शैडॉ/i.test(t);if(!(m||w||Date.now()<awake))return;awake=Date.now()+45e3;
t=t.replace(/shadow|शैडो|शेडो/gi,'').trim()||'hello';if(m&&m!=S.mode)setMode(m,t);else go(t)}
function setMode(m,t){S.mode=m;document.body.dataset.m=m;$('#log').textContent='';S.h[m].slice(-8).forEach(bubble);save();if(t)return go(t);if(m=='love'&&KEY2()&&!S.p){ask=1;add('a',Q,1)}else add('a',GREET[m],1)}
async function go(t){busy=1;state('THINKING');add('u',t);const k=KEY2();
if(k&&S.mode=='love'&&!S.p){if(!ask){ask=1;add('a',Q,1);busy=0;return}S.p=t;ask=0;save()}
const b=bubble({r:'a',x:'…'});let tx=null,er='';
if(k){try{const h=S.h[S.mode].slice(-15,-1).map(m=>(m.r=='u'?'Atishay: ':'SHADOW: ')+m.x).join('\n');
tx=await viaAI(k,'Tu SHADOW hai, Atishay ka personal AI dost, voice se baat hoti hai. Hinglish (Roman Hindi+English) me natural jawab de, chhote (2-3 lines) jab tak code/zaroorat na ho. Aaj: '+new Date().toDateString()+'. '+phone()+' Phone actions ke tags: [[call:number]], [[open:url]], [[search:query]].\n'+SYS[S.mode].replace('@P',S.p)+'\n\nPichli baat:\n'+h+'\n\nAtishay: '+t+'\nJawab:')}catch(e){er=e.code=='api'?'⚠ AI error: '+e.message+'\n':''}}
if(tx==null){try{tx=local(t);if(tx==null)tx=await webAns(t)}catch(e){tx='Net me dikkat hai, Google khol deta hu. [[search:'+clean(t)+']]'}
if(S.mode=='love'&&!/^Atishay/.test(tx))tx='Atishay 💗 '+tx;tx=er+tx}
store('a',tx);fill(b,tx);busy=0;say(tx);act(tx)}
const clean=t=>(t.toLowerCase().replace(/\b(shadow|search|dhundo|dhoondo|khojo|google|par|pe|karo|kar|batao|bata|bataiye|sunao|kya|hai|kaun|kon|ke baare me|ke bare me|about|tell me|who is|what is|please)\b/g,' ').replace(/\s+/g,' ').trim())||t;
const tmo=u=>{const c=new AbortController();setTimeout(()=>c.abort(),8000);return fetch(u,{signal:c.signal}).then(r=>{if(!r.ok)throw 0;return r.json()})};
async function webAns(t){const q=clean(t);
const wk=async L=>{const s=await tmo('https://'+L+'.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&srlimit=1&format=json&origin=*'),h=s.query.search[0];if(!h)return null;
const d=await tmo('https://'+L+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(h.title));return d.extract?d.extract.split('. ').slice(0,2).join('. ').replace(/\.?$/,'.')+' (Wikipedia)':null};
let x=null;try{x=await wk(/[\u0900-\u097F]/.test(q)?'hi':'en')}catch(e){}
return (x||'Iska seedha jawab nahi mila.')+' Poori web search ke liye button dabao. [[search:'+q+']]'}
const SH=['Tere bina ye din adhoora sa lagta hai,\nteri ek muskaan se mera mausam badalta hai.','Raat ko chaand se maine tera zikr kiya,\nusne bhi kaha — us jaisa koi aur kahan.','Lafz kam pad jaate hain jab tu saamne ho,\nchup rehna bhi tujhse baat jaisa lagta hai.'];
const JK=['Teacher: tum late kyu ho? Student: sir, signboard pe likha tha "School ahead, go slow".','Phone: 1% battery. Main: bas ek aur reel. Phone: band.'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function local(t){const q=t.toLowerCase(),n=(q.match(/\+?\d[\d\s-]{7,}/)||[''])[0];
if(/\b(hello|hi|namaste|hey)\b|नमस्ते/.test(q))return'Namaste Atishay! Bolo, kya karna hai?';
if(/kaise ho|how are you/.test(q))return'Main badhiya hu, tum batao.';
if(/tum kaun|aap kaun|your name|tera naam|tumhara naam/.test(q))return'Main SHADOW hu, tumhara personal assistant.';
if(/\b(code|python|java|html|program|script)\b/.test(q))return'Code khud likhne ke liye AI chahiye, abhi nahi likh sakta. Google par dhundh deta hu. [[search:'+clean(t)+' code]]';
if(/battery|बैटरी/.test(q))return'Battery '+(D.bat==null?'pata nahi chal raha':D.bat+'% hai'+(D.chg?', charging chal rahi hai':''))+'.';
if(/time|samay|baje|टाइम/.test(q))return'Abhi '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' ho rahe hain.';
if(/date|tarikh|din kya/.test(q))return'Aaj '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+' hai.';
if(/network|net speed|internet/.test(q))return'Network '+D.net+', speed '+D.dl+' Mbps, latency '+D.rtt+' ms.';
if(/shayari|shayri|शायरी/.test(q))return pick(SH);
if(/joke|chutkula|चुटकुला/.test(q))return pick(JK);
if(n&&/call|phone|dial|लगा/.test(q))return'Call lagaata hu. [[call:'+n.replace(/\s|-/g,'')+']]';
const A={youtube:'youtube.com',whatsapp:'wa.me',instagram:'instagram.com',maps:'maps.google.com',gmail:'mail.google.com',facebook:'facebook.com'};
for(const k in A)if(q.includes(k)&&/khol|open|chalu|start/.test(q))return k+' khol raha hu. [[open:'+A[k]+']]';
return null}
function act(x){const a=[...x.matchAll(TAG)][0];if(!a)return;const v=a[2].trim();try{if(a[1]=='call')location.href='tel:'+v.replace(/[^\d+]/g,'');else window.open(a[1]=='open'?(/^https?:\/\//.test(v)?v:'https://'+v):'https://www.google.com/search?q='+encodeURIComponent(v),'_blank')}catch(e){}}
const KEY2=()=>{try{return localStorage.getItem('shadow_key')}catch(e){return null}};
async function viaGem(k,inp){let ms=[];try{ms=JSON.parse(localStorage.getItem('shadow_gm')||'[]')}catch(e){}
if(!ms.length){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+k),j=await r.json();if(!r.ok)throw{code:'api',message:j.error&&j.error.message};
const v=n=>parseFloat((n.match(/gemini-([\d.]+)/)||[0,0])[1]);
ms=(j.models||[]).filter(m=>/flash/.test(m.name)&&!/lite|image|tts|live|audio|embed|exp|vision|thinking|robot|computer|8b/.test(m.name)&&(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).sort((a,b)=>v(b)-v(a)||(/preview/.test(a)-/preview/.test(b))).slice(0,3);
try{localStorage.setItem('shadow_gm',JSON.stringify(ms))}catch(e){}}catch(e){if(e.code=='api')throw e}}
if(!ms.length)ms=['gemini-2.5-flash'];
let last='';for(const m of ms){for(const t of [1,0]){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':k},body:JSON.stringify(Object.assign({contents:[{role:'user',parts:[{text:inp+(t?'\nTujhe Google Search hai: live/latest info ke liye use kar.':'')}]}]},t?{tools:[{google_search:{}}]}:{}))});const j=await r.json();
if(r.ok){const x=((j.candidates||[])[0]||{}).content,tx=((x&&x.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');if(tx)return tx;last='Khaali jawab aaya';continue}
last=(j.error&&j.error.message)||'error';if(r.status==429||r.status==401||(r.status==403&&!/tool|search/i.test(last)))throw{code:'api',message:last}}catch(e){if(e.code=='api')throw e;last=last||'Network error'}}}
throw{code:'api',message:last}}
const OA={'gsk_':['https://api.groq.com/openai/v1',/llama|gpt-oss|qwen/],'sk-or-':['https://openrouter.ai/api/v1',/:free$/]};
async function viaOA(k,inp,p){const[base,re]=OA[p],H={'content-type':'application/json',authorization:'Bearer '+k};let ms=[];try{ms=JSON.parse(localStorage.getItem('shadow_om')||'[]')}catch(e){}
if(!ms.length){const r=await fetch(base+'/models',{headers:H}),j=await r.json();if(!r.ok)throw{code:'api',message:(j.error&&j.error.message)||'Key galat lagti hai'};
const sc=id=>/70b|120b|versatile|large/.test(id)?0:1;
ms=(j.data||[]).map(m=>m.id).filter(id=>re.test(id)&&!/whisper|guard|tts|embed|vision|audio|safeguard|prompt/.test(id)).sort((a,b)=>sc(a)-sc(b)).slice(0,4);try{localStorage.setItem('shadow_om',JSON.stringify(ms))}catch(e){}}
let last='Koi model nahi mila';for(const m of ms){try{const r=await fetch(base+'/chat/completions',{method:'POST',headers:H,body:JSON.stringify({model:m,max_tokens:900,messages:[{role:'user',content:inp}]})}),j=await r.json();
if(r.ok){const x=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(x)return x.replace(/<think>[\s\S]*?<\/think>/g,'').trim();last='Khaali jawab';continue}
last=(j.error&&j.error.message)||'error';if(r.status==401||r.status==429)throw{code:'api',message:last}}catch(e){if(e.code=='api')throw e;last=last||'Network error'}}
throw{code:'api',message:last}}
const viaAI=(k,inp)=>/^AIza/.test(k)?viaGem(k,inp):/^gsk_/.test(k)?viaOA(k,inp,'gsk_'):viaOA(k,inp,'sk-or-');
$('#gear').onclick=()=>{$('#kb').style.display='flex';$('#km').textContent=KEY2()?'Key saved hai. Khaali SAVE dabane se hat jayegi.':''};
$('#kc').onclick=()=>$('#kb').style.display='none';
$('#ks').onclick=async()=>{const k=$('#ki').value.trim(),m=$('#km');
if(!k){try{localStorage.removeItem('shadow_key')}catch(e){}m.textContent='Key hata di. Ab search mode chalega.';return}
if(!/^(AIza|gsk_|sk-or-)/.test(k)){m.textContent='Key AIza (Google), gsk_ (Groq) ya sk-or- (OpenRouter) se shuru honi chahiye.';return}m.textContent='Test ho raha hai…';
try{await viaAI(k,'Say ok');try{localStorage.setItem('shadow_key',k);localStorage.removeItem('shadow_gm');localStorage.removeItem('shadow_om')}catch(e){}m.textContent='✔ Key chal gayi, AI mode on.';$('#ki').value='';setTimeout(()=>$('#kb').style.display='none',1300)}
catch(e){m.textContent='✘ '+(e.message||'Network error')+(k.length!=39?' (Tumhari key '+k.length+' akshar ki hai, Google key aam taur par 39 ki hoti hai — poori copy karo)':'')}};
/* ---- start: auto-try, else first tap anywhere ---- */
document.body.addEventListener('pointerdown',()=>{on=1;deny=0;listen();try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}
add('a',GREET[S.mode],1)},{once:true});
document.body.dataset.m=S.mode;S.h[S.mode].slice(-8).forEach(bubble);
on=1;listen();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
